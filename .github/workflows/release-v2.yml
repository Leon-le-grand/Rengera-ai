name: Release Rengera V4 Mesh

on:
  workflow_dispatch:
    inputs:
      target:
        description: Target deployment mesh environment
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read

concurrency:
  group: rengera-v4-release-${{ inputs.target || 'staging' }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  promote:
    needs: verify
    runs-on: ubuntu-latest
    environment: ${{ inputs.target || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Record OCI canary promotion readiness
        run: |
          echo "Target environment: ${{ inputs.target || 'staging' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "SPIFFE/eBPF canary mesh verification passed." >> "$GITHUB_STEP_SUMMARY"
