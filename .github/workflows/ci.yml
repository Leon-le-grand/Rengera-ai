name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  agent-runtime:
    name: Agent Runtime & Control Plane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify v4 control plane modules
        run: |
          python3 -m py_compile \
            server/app/main.py \
            server/app/agent_runtime/planner.py \
            server/app/agent_runtime/ast_graph.py \
            server/app/deploy_mesh/rollout.py \
            server/app/deploy_mesh/ebpf_collector.py \
            server/app/deploy_mesh/spiffe_rotator.py \
            server/app/sandbox/firecracker.py \
            server/app/sandbox/snapshot_cache.py

  platform-studio:
    name: Mission Control Studio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Mission Control manifests and feature modules
        run: |
          test -f platform/package.json
          test -f platform/src/features/agent-runs/AgentRunsPanel.tsx
          test -f platform/src/features/agent-runs/SpeculativeDiffViewer.tsx
          test -f platform/src/features/deploy-mesh/CanaryTopologyView.tsx
          test -f platform/src/features/deploy-mesh/CanaryGateBanner.tsx

  docs-and-specs:
    name: Architecture & Protocol Specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify v4 documentation index
        run: |
          test -f README.md
          test -f ARCHITECTURE.md
          test -f docs/README.md
          test -f docs/v2/AGENT-RUNTIME.md
          test -f docs/v2/DEPLOY-MESH.md
          test -f docs/v2/EBPF-TELEMETRY.md
          test -f docs/v2/WASM-POLICY.md
